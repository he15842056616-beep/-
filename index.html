<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone 关于本机 模拟器</title>


<script src="html2canvas.min.js"></script>
<style>
:root{--bg:#f4f4f6;--panel:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#dcdce1;--acc:#0a7aff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--panel:#1c1c1e;--ink:#f5f5f7;--sub:#98989f;--line:#323236;--acc:#2f8cff}}
:root[data-theme="dark"]{--bg:#0b0b0d;--panel:#1c1c1e;--ink:#f5f5f7;--sub:#98989f;--line:#323236;--acc:#2f8cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"PingFang SC","Helvetica Neue",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:1000px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.app{grid-template-columns:420px minmax(0,1fr);gap:40px;padding-top:32px}.stage{position:sticky;top:24px;align-self:start}}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
#wrap{overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.28);flex:none}
#scaler{width:393px;height:852px;transform-origin:0 0}
button{font:inherit;cursor:pointer}
.primary{width:100%;max-width:393px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;font-size:16px;padding:14px}
.primary:disabled{opacity:.6}
.panel{display:grid;gap:22px;align-content:start}
h1{font-size:20px;margin:0 0 2px}
.hint{color:var(--sub);margin:0;font-size:14px}
.grp{background:var(--panel);border-radius:16px;padding:16px;display:grid;gap:14px}
.grp>h2{margin:0;font-size:13px;font-weight:600;color:var(--sub)}
.f{display:grid;gap:6px;min-width:0}
.f>span{font-size:13px;color:var(--sub)}
input[type=text],input[type=number],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.with{display:flex;gap:8px}
.mini{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:10px}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff;font-weight:600}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:20px;height:20px}
.hide{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:9}
#modal.on{display:flex}
#out{max-height:68vh;max-width:100%;border-radius:12px}
#modal p{color:#fff;margin:0;font-size:14px}
#modal .row2{display:flex;gap:10px}
#modal .row2 button{border:0;border-radius:12px;padding:12px 22px;font-weight:600}
#dl{background:var(--acc);color:#fff}#cl{background:#fff;color:#111}

/* ---------- 模拟的 iPhone 屏幕（固定 393×852 pt） ---------- */
#shot{width:393px;height:852px;position:relative;overflow:hidden;background:var(--s-bg);color:var(--s-ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Inter,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
#shot.dark{--s-bg:#000;--s-card:#1c1c1e;--s-ink:#fff;--s-val:#8e8e93;--s-line:#38383a;--s-chev:#707075;--s-btn:#2a2a2c;--b-track:rgba(142,142,147,.4);--b-fill:#fff;--b-onfill:#000;--b-ontrack:#fff}
#shot.light{--s-bg:#f2f2f7;--s-card:#fff;--s-ink:#000;--s-val:#8a8a8e;--s-line:#e3e3e8;--s-chev:#c4c4c7;--s-btn:#fff;--b-track:rgba(60,60,67,.3);--b-fill:#000;--b-onfill:#fff;--b-ontrack:#000}
#shot.light .back{position:absolute;left:16px;top:59.5px;width:43px;height:43px;border-radius:50%;background:var(--s-btn);border:1px solid var(--s-ring);display:flex;align-items:center;justify-content:center}
.time{position:absolute;left:0;top:17px;width:142.67px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:24px;font-weight:700;white-space:nowrap}
.sb{position:absolute;right:33px;top:21.5px;height:16px;display:flex;align-items:center;gap:6px}
.bat{position:absolute;left:332.67px;top:22.33px;width:24.67px;height:13.67px;border-radius:4.6px;background:var(--b-track);overflow:hidden}
.bat .fill{position:absolute;left:0;top:0;bottom:0;overflow:hidden;z-index:1;background:var(--b-fill)}
.bat .t{position:absolute;left:0;top:0;width:24.67px;height:13.67px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:-.2px;color:var(--b-ontrack)}
.bat .fill .t{color:var(--b-onfill)}
.nub{position:absolute;left:358.7px;top:26.5px;width:1.8px;height:5.4px;border-radius:0 1.2px 1.2px 0;background:var(--b-track);opacity:.7}
.back{position:absolute;left:16px;top:59.5px;width:43px;height:43px;border-radius:50%;background:var(--s-btn);border:1px solid var(--s-ring);display:flex;align-items:center;justify-content:center}
.ttl{position:absolute;left:0;right:0;top:67px;text-align:center;font-size:17px;line-height:28px;font-weight:600}
.col{position:absolute;left:16px;right:16px;top:130.67px}
.card{background:var(--s-card);border-radius:26px;margin-bottom:35px;overflow:hidden}
.row{position:relative;height:53.333px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-size:17px;gap:12px}
.row b{font-weight:600;white-space:nowrap}
.r{display:flex;align-items:center;min-width:0}
.v{color:var(--s-val);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.chev{margin-left:12px;flex:none}
.hr{height:1px;margin:-.5px 20px;background:var(--s-line);position:relative;z-index:1}
.ic{display:flex;flex:none}.sgb{position:absolute;width:3.33px;border-radius:1.7px;background:var(--s-ink)}.sgb.off{opacity:.25}
.home{position:absolute;left:126.5px;bottom:8px;width:140px;height:5px;border-radius:3px;background:var(--s-ink)}
#ttl,.time,.sgb,#pWifi,#batIco,.back{z-index:3}
.row>.v,.row>.r,.row>.ic{margin-left:auto}
#shot.dark{--s-h1:#171718;--s-h2:#0b0b0c;--s-hl:#232323;--s-ring:rgba(255,255,255,.14);--s-red:#ff453a}
#shot.light{--s-h1:#f9f9fb;--s-h2:#f2f2f6;--s-hl:#d9d9de;--s-ring:rgba(0,0,0,.06);--s-red:#ff3b30}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div id="wrap"><div id="scaler">
      <div id="shot" class="dark">
        <div class="time"><span id="pTime"></span><img id="pStar" class="hide" alt="" style="width:15.67px;height:15px;margin-left:4.5px;position:relative;top:-.7px"></div>
        <div class="sgb" style="left:281.67px;top:28.97px;height:6.33px"></div><div class="sgb" style="left:287px;top:26.97px;height:8.33px"></div><div class="sgb" style="left:292.33px;top:24.63px;height:10.67px"></div><div class="sgb" style="left:297.67px;top:22.97px;height:12.33px"></div>
        <img id="pWifi" alt="" style="position:absolute;left:307.33px;top:22.33px;width:18.67px;height:13.67px">
        <span id="batIco" style="position:absolute;left:332.67px;top:22.33px;width:28px;height:13.67px;display:flex"></span>
        <div class="back"><span class="ic" data-k="back"></span></div>
        <img id="ttl" alt="">
        <div class="col" id="pgAbout">
          <div class="card">
            <div class="row"><img data-l="name" alt=""><div class="r"><span class="v" id="pName"></span><span class="ic chev" data-k="chev"></span></div></div><div class="hr"></div>
            <div class="row"><img data-l="ios" alt=""><div class="r"><span class="v" id="pIos"></span><span class="ic chev" data-k="chev"></span></div></div><div class="hr"></div>
            <div class="row"><img data-l="mname" alt=""><span class="v" id="pModel"></span></div><div class="hr"></div>
            <div class="row"><img data-l="mnum" alt=""><span class="v" id="pMnum"></span></div><div class="hr"></div>
            <div class="row"><img data-l="sn" alt=""><span class="v" id="pSn"></span></div>
          </div>
          <div class="card"><div class="row"><img data-l="war" alt=""><b id="pWar" class="hide"></b><span class="ic" data-k="chev"></span></div></div>
          <div class="card hide" id="pRepair"><div class="row"><img data-l="repair" alt=""><span class="ic" data-k="chev"></span></div></div>
          <div class="card">
            <div class="row"><img data-l="songs" alt=""><span class="v" id="pSongs"></span></div><div class="hr"></div>
            <div class="row"><img data-l="videos" alt=""><span class="v" id="pVideos"></span></div><div class="hr"></div>
            <div class="row"><img data-l="photos" alt=""><span class="v" id="pPhotos"></span></div><div class="hr"></div>
            <div class="row"><img data-l="apps" alt=""><span class="v" id="pApps"></span></div><div class="hr"></div>
            <div class="row"><img data-l="cap" alt=""><span class="v" id="pCap"></span></div><div class="hr"></div>
            <div class="row"><img data-l="avail" alt=""><span class="v" id="pAvail"></span></div>
          </div>
        </div>
        <div class="home"></div>
      </div>
    </div></div>
    <button class="primary" id="save">保存图片</button>
  </section>

  <section class="panel">
    <div><h1>iPhone “关于本机” 模拟器</h1><p class="hint">修改下方内容，左侧实时预览，满意后点“保存图片”。导出尺寸为 1179×2556。</p></div>

    <div class="grp"><h2>外观</h2>
      <div class="seg" id="themeSeg"><button data-theme="dark" aria-pressed="true">深色模式</button><button data-theme="light" aria-pressed="false">浅色模式</button></div>
    </div>

    <div class="grp pAbout"><h2>设备信息</h2>
      <label class="f"><span>机型（型号名称）</span><select id="modelSel"></select></label>
      <label class="f hide" id="modelBox"><span>自定义机型</span><input type="text" id="modelIn" placeholder="例如 iPhone 18 Pro Max"></label>
      <label class="f"><span>名称</span><input type="text" id="name"></label>
      <div class="g2">
        <label class="f"><span>iOS 版本</span><input type="text" id="ios"></label>
        <label class="f"><span>保障状态</span><select id="war"><option>保障已过期</option><option>有限保修</option><option>AppleCare+ 保障</option></select></label>
      </div>
      <label class="f"><span>型号</span><div class="with"><input type="text" id="mnum"><button class="mini" id="rMnum">随机</button></div></label>
      <label class="f"><span>序列号</span><div class="with"><input type="text" id="sn"><button class="mini" id="rSn">随机</button></div></label>
      <label class="f"><span>总容量</span><select id="capSel"></select></label>
      <label class="f hide" id="capBox"><span>自定义容量</span><input type="text" id="capIn" placeholder="例如 4 TB"></label>
      <label class="f"><span>可用容量</span><input type="text" id="avail"></label>
      <label class="chk"><input type="checkbox" id="rep"> 显示“部件与维修历史”</label>
    </div>

    <div class="grp pAbout"><h2>数量</h2>
      <div class="g2">
        <label class="f"><span>歌曲</span><input type="number" min="0" id="songs"></label>
        <label class="f"><span>视频</span><input type="number" min="0" id="videos"></label>
        <label class="f"><span>照片</span><input type="number" min="0" id="photos"></label>
        <label class="f"><span>应用程序</span><input type="number" min="0" id="apps"></label>
      </div>
    </div>

    <div class="grp"><h2>状态栏</h2>
      <div class="g2">
        <label class="f"><span>时间</span><input type="text" id="time" maxlength="5"></label>
        <label class="f"><span>电量（%）</span><input type="number" min="1" max="100" id="bat"></label>
      </div>
      <label class="chk"><input type="checkbox" id="chg"> 充电中（绿色电池）</label>
      <label class="f"><span>信号格数</span><select id="sig"><option>4</option><option selected>3</option><option>2</option><option>1</option></select></label>
      <label class="chk"><input type="checkbox" id="star"> 时间旁显示专注模式图标（★）</label>
    </div>
  </section>
</div>

<div id="modal">
  <img id="out" alt="生成的图片">
  <p>长按图片即可保存到相册</p>
  <div class="row2"><button id="dl">保存到设备</button><button id="cl">关闭</button></div>
</div>

function labels(dk){
  document.querySelectorAll('img[data-l]').forEach(im=>{const o=LB[im.dataset.l];im.src=dk?o.d:o.l;im.style.cssText=`position:absolute;left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px`});
  const t=LB.title,e=$('ttl');e.src=dk?t.d:t.l;e.style.cssText=`position:absolute;left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px`;
}
function batSVG(){
  const dk=S.theme==='dark',chg=S.chg,lv=Math.min(100,Math.max(1,parseInt(S.bat)||1));
  const ff=APPLE?"-apple-system,system-ui,'SF Pro Text',sans-serif":"Inter,'Noto Sans SC',sans-serif";
  let track,fill,a,b;
  if(chg){track=dk?'#4c4c4c':'#c7c7cc';fill='#34c759';a='#ffffff';b=dk?'#ffffff':'#000000'}
  else if(lv<=20){track=dk?'#888889':'#c7c7cc';fill='#ff453a';a='#ffffff';b=dk?'#ffffff':'#000000'}
  else{track=dk?'#888889':'#c7c7cc';fill=dk?'#ffffff':'#000000';a=dk?'#1c1c1e':'#ffffff';b=dk?'#1c1c1e':'#000000'}
  const fw=(24.67*lv/100).toFixed(2),tx=chg?9.8:12.33,fs=lv>=100?10:12.3;
  const txt=c=>`<text x="${tx}" y="11.2" text-anchor="middle" font-family="${ff}" font-weight="800" font-size="${fs}" fill="${c}">${lv}</text>`;
  const bolt=chg?`<path transform="translate(17.7 2.6) scale(.8)" d="M4.9 0 .4 6.2h2.7L2.2 10.4 6.7 4H3.9z" fill="${b}"/>`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="13.67" viewBox="0 0 28 13.67"><defs><clipPath id="bc"><rect width="24.67" height="13.67" rx="4.6"/></clipPath><clipPath id="fc"><rect width="${fw}" height="13.67"/></clipPath><clipPath id="tc"><rect x="${fw}" width="24.67" height="13.67"/></clipPath></defs><g clip-path="url(#bc)"><rect width="24.67" height="13.67" fill="${track}"/><rect width="${fw}" height="13.67" fill="${fill}"/></g><path d="M25.3 4.2H26.1A1.5 1.5 0 0 1 27.6 5.7V7.97A1.5 1.5 0 0 1 26.1 9.47H25.3Z" fill="${track}"/><g clip-path="url(#fc)">${txt(a)}</g><g clip-path="url(#tc)">${txt(b)}</g>${bolt}</svg>`;
}
const fmt=n=>(Number(n)||0).toLocaleString('en-US');

function render(){
  $('shot').className=S.theme;
  $('pTime').textContent=S.time;$('pAvail').textContent=S.avail;
  const dk=S.theme==='dark';
  $('shot').style.fontFamily=APPLE?'-apple-system,system-ui,"SF Pro Text","PingFang SC",sans-serif':'Inter,"Noto Sans SC",sans-serif';
  $('pStar').src=SPR.star[dk?0:1];$('pWifi').src=SPR.wifi[dk?0:1];
  $('pRepair').classList.toggle('hide',!S.repair);
  const wl=S.war==='保障已过期';document.querySelector('[data-l=war]').classList.toggle('hide',!wl);$('pWar').classList.toggle('hide',wl);
  labels(dk);
  document.querySelectorAll('.ic').forEach(el=>el.innerHTML=ICO[el.dataset.k](dk));
  document.querySelectorAll('.sgb').forEach((r,i)=>r.classList.toggle('off',i>=S.sig));
  $('pStar').classList.toggle('hide',!S.star);
  $('pName').textContent=S.name;$('pIos').textContent=S.ios;
  $('pModel').textContent=S.model;$('pMnum').textContent=S.mnum;$('pSn').textContent=S.sn;
  $('pWar').textContent=S.war;$('pCap').textContent=S.cap;
  $('pSongs').textContent=fmt(S.songs);$('pVideos').textContent=fmt(S.videos);
  $('pPhotos').textContent=fmt(S.photos);$('pApps').textContent=fmt(S.apps);
  $('batIco').innerHTML=batSVG();
}

/* 绑定文本输入 */
[['name','name'],['ios','ios'],['mnum','mnum'],['sn','sn'],['time','time'],['songs','songs'],['videos','videos'],['photos','photos'],['apps','apps'],['bat','bat'],['avail','avail']]
 .forEach(([id,k])=>{$(id).value=S[k];$(id).addEventListener('input',e=>{S[k]=e.target.value;render()})});
$('chg').addEventListener('change',e=>{S.chg=e.target.checked;render()});
$('war').addEventListener('change',e=>{S.war=e.target.value;render()});
$('sig').addEventListener('change',e=>{S.sig=+e.target.value;render()});
$('star').addEventListener('change',e=>{S.star=e.target.checked;render()});
$('rSn').onclick=()=>{S.sn=rnd(10);$('sn').value=S.sn;render()};
$('rMnum').onclick=()=>{S.mnum='M'+rnd(3)+'3CH/A';$('mnum').value=S.mnum;render()};
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{
  S.theme=b.dataset.theme;
  document.querySelectorAll('#themeSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});

/* 下拉 + 自定义 */
function pick(selId,boxId,inId,list,key,init){
  const sel=$(selId);
  sel.innerHTML=list.map(v=>`<option>${v}</option>`).join('')+'<option value="__c">自定义…</option>';
  sel.value=init;
  sel.addEventListener('change',()=>{
    const c=sel.value==='__c';$(boxId).classList.toggle('hide',!c);
    if(c){$(inId).focus()}else{S[key]=sel.value}render();
  });
  $(inId).addEventListener('input',e=>{S[key]=e.target.value;render()});
}
pick('modelSel','modelBox','modelIn',MODELS,'model','iPhone 15 Pro');
pick('capSel','capBox','capIn',CAPS,'cap','256 GB');

/* 预览缩放 */
function fit(){
  const w=$('stage').clientWidth;
  let s=Math.min(1,w/393);
  if(innerWidth>=860)s=Math.min(s,(innerHeight-130)/852);
  s=Math.max(.3,s);
  $('scaler').style.transform=`scale(${s})`;
  const wr=$('wrap').style;wr.width=393*s+'px';wr.height=852*s+'px';wr.borderRadius=46*s+'px';
}
addEventListener('resize',fit);

/* 保存图片 */
let blob=null,url='';
$('save').onclick=async()=>{
  const b=$('save');b.disabled=true;b.textContent='正在生成…';
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const c=await html2canvas($('shot'),{scale:3,backgroundColor:null,logging:false,onclone:d=>{
      d.getElementById('wrap').style.cssText='width:393px;height:852px;border-radius:0;box-shadow:none;overflow:visible';
      d.getElementById('scaler').style.transform='none';
    }});
    blob=await new Promise(r=>c.toBlob(r,'image/png'));
    if(url)URL.revokeObjectURL(url);
    url=URL.createObjectURL(blob);
    $('out').src=url;$('modal').classList.add('on');
  }catch(e){alert('图片生成失败，请刷新页面后重试')}
  b.disabled=false;b.textContent='保存图片';
};
$('cl').onclick=()=>$('modal').classList.remove('on');
$('dl').onclick=async()=>{
  if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.saveImage){const fr=new FileReader();fr.onload=()=>webkit.messageHandlers.saveImage.postMessage(fr.result);fr.readAsDataURL(blob);return}
  const name='iphone-about.png';let d=null;
  try{d=window.claude?await claude.use('downloads'):null}catch(e){}
  if(d){try{await d.save({filename:name,data:blob})}catch(e){}}
  else{const a=document.createElement('a');a.href=url;a.download=name;a.click()}
};

$('rep').addEventListener('change',e=>{S.repair=e.target.checked;render()});
render();fit();
</script>
